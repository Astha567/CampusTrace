<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CampusTrace - University Life & Campus Navigation Guide</title>
    <meta name="description" content="CampusTrace by Team Offshore: An accessible, student-friendly digital guide to university life with interactive campus maps, event hub, calendar reminders, verified contacts, and AI assistant." />
    <meta property="og:title" content="CampusTrace - University Life & Campus Guide" />
    <meta property="og:description" content="CampusTrace by Team Offshore: An accessible, student-friendly digital guide to university life with interactive campus maps, event hub, calendar reminders, verified contacts, and AI assistant." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('campustrace_theme');
          var savedDark = localStorage.getItem('campustrace_dark_mode') || localStorage.getItem('everywhere_door_dark_mode');
          var isDark = false;
          if (savedTheme === 'dark') {
            isDark = true;
          } else if (savedTheme === 'light') {
            isDark = false;
          } else if (savedDark !== null) {
            isDark = JSON.parse(savedDark);
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            isDark = true;
          }
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FFF5D6] dark:bg-[#181216] text-[#2D1F25] dark:text-[#F7EBEF] font-sans antialiased selection:bg-[#F2B4C0] selection:text-[#5E1B2C]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
